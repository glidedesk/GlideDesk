[package]
name = "glidedesk"
version = "3.2.0"
description = "GlideDesk — Lightweight, Zero-Latency Multi-Device KVM (Tauri v2 + Rust)"
authors = ["GlideDesk Contributors"]
license = "GPL-3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.23"
futures-util = "0.3"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
arboard = "3.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
rand = "0.8"
cpal = "0.15"
nokhwa = { version = "0.10.11", features = ["input-native"] }
rcgen = "0.14.10"
rustls = "0.23.46"
tokio-rustls = "0.26.6"
tauri-plugin-single-instance = "2.0"
socket2 = { version = "0.5", features = ["all"] }
tauri-plugin-notification = "2"
plist = "1"
tauri-plugin-dialog = "2"
# xcap v0.1.1 has compatibility issues with modern rustc; using scrap or image capture natively



[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_System_StationsAndDesktops",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["xtest", "record", "xinput", "xkb"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
